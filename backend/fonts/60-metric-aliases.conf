<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The templates ask for Georgia, Helvetica and Arial, which a Linux server doesn't have.
  These stand-ins have the same letter widths ("metric-compatible"), so lines break and
  pages end where they do on a Mac: Gelasio for Georgia (bundled, OFL), Liberation Sans
  for Helvetica and Arial, Liberation Serif for Times.
-->
<fontconfig>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
</fontconfig>
