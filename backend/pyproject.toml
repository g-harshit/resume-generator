[project]
name = "resume-generator-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "openai>=3.22.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "weasyprint>=63",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# PyMuPDF's SWIG bindings warn on import under Python 3.12; not ours to fix.
filterwarnings = ["ignore:builtin type (SwigPy|swigvarlink):DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# Resume text is full of en dashes, curly quotes and bullets on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The template imports sqlmodel for autogenerated AutoString columns; not every migration uses it.
"alembic/versions/*" = ["F401"]
# Tests quote realistic resume lines; wrapping them would make them harder to read.
"tests/*" = ["E501"]
