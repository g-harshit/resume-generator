# Local Postgres for development and the test suite.
# Port 5433 on the host so it can sit beside any other Postgres on 5432.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
      POSTGRES_DB: resume
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
