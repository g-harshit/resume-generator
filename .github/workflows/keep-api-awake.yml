# The API runs on Render's free plan, which puts it to sleep after 15 idle minutes; the
# next visitor then waits up to a minute for it to wake. A light ping every 10 minutes
# keeps it awake. Delete this file after moving the API to a paid plan (which never
# sleeps). GitHub may run scheduled jobs a few minutes late; that's fine here.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 https://api.quickfitcv.com/health
