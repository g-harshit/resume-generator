# A BACKSTOP, not the thing that keeps the API awake.
#
# Render's free plan sleeps the API after 15 idle minutes. This was meant to ping it
# every 10 minutes, but GitHub runs scheduled workflows on a best-effort basis: it
# ran every 2–6 hours (Oct 2026). What keeps the API awake is the API pinging its
# own public URL (backend/app/services/keep_awake.py). This stays because it runs
# from outside: if the service ever does fall asleep, the in-process loop died with
# it, and the next run here wakes it. Off the top of the hour, GitHub's peak.
name: Keep API awake

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch: # run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 https://api.quickfitcv.com/health
